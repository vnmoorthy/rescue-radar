<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Radar · Dispatch Console</title>
<meta name="description" content="Rescue Radar reads disaster posts in real time, classifies them into the 10 HumAID categories with a LoRA fine-tuned NVIDIA Nemotron on Fireworks, and routes rescue-critical ones to a dispatcher's priority queue.">
<meta name="color-scheme" content="dark light">
<script>/* Theme before first paint (guide/THEME.md): ?theme=light|dark wins (QA, demos), then the saved choice, then the OS. */
(function(){var d=document.documentElement,ok=function(v){return v==='light'||v==='dark';},t=null,src='os';
try{var q=new URLSearchParams(location.search).get('theme');if(ok(q)){t=q;src='url';}}catch(e){}
if(!t){try{var s=localStorage.getItem('rr-theme');if(ok(s)){t=s;src='saved';}}catch(e){}}
if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
d.setAttribute('data-theme',t);d.setAttribute('data-theme-src',src);})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311120F'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23F2A93B' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%23F2A93B' stroke-width='2'/%3E%3Cpath d='M16 16 L25 9' stroke='%23FF5B3A' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='22.5' cy='10.8' r='2.2' fill='%23FF5B3A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css?v=sunrise-2">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" class="ring"/>
      <circle cx="20" cy="20" r="11" class="ring"/>
      <circle cx="20" cy="20" r="5" class="ring"/>
      <g class="sweep"><path d="M20 20 L20 3 A17 17 0 0 1 34.7 11.5 Z" class="sweep__fill"/><path d="M20 20 L34.7 11.5" class="sweep__line"/></g>
      <circle cx="29" cy="13.5" r="2.6" class="blip"/>
    </svg>
    <div class="brand__text">
      <span class="brand__name">Rescue Radar</span>
      <span class="brand__sub">Dispatch console</span>
    </div>
  </div>
  <div class="health" id="health" aria-live="polite">
    <span class="pill pill--wait"><i class="dot"></i>Connecting…</span>
  </div>
  <div class="topbar__actions">
    <span class="model-badge" id="model-badge" title="Active model">loading model…</span>
    <button class="icon-btn theme-btn" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="true" title="Switch to light theme (T)">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="i-moon"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
    </button>
    <button class="icon-btn" id="help-btn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Views">
    <button type="button" class="rail__btn" data-view="replay" aria-label="Live Replay (1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/></svg>
      <span>Replay</span><kbd>1</kbd></button>
    <button type="button" class="rail__btn" data-view="triage" aria-label="Triage Desk (2)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m15 17 2.2 2.2L21 15"/></svg>
      <span>Triage</span><kbd>2</kbd></button>
    <button type="button" class="rail__btn" data-view="h2h" aria-label="Head-to-Head (3)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.5"/></svg>
      <span>Head-to-head</span><kbd>3</kbd></button>
    <button type="button" class="rail__btn" data-view="bench" aria-label="Benchmark (4)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Benchmark</span><kbd>4</kbd></button>
    <button type="button" class="rail__btn" data-view="how" aria-label="How it works (5)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.4 11 16.6 7M7.4 13l9.2 4"/></svg>
      <span>How it works</span><kbd>5</kbd></button>
  </nav>

  <main id="main" tabindex="-1">
    <section class="view" id="view-replay" data-view="replay" aria-label="Live Replay"></section>
    <section class="view" id="view-triage" data-view="triage" aria-label="Triage Desk" hidden></section>
    <section class="view" id="view-h2h" data-view="h2h" aria-label="Head-to-Head" hidden></section>
    <section class="view" id="view-bench" data-view="bench" aria-label="Benchmark" hidden></section>
    <section class="view" id="view-how" data-view="how" aria-label="How it works" hidden></section>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="overlay" id="help" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="dialog__head">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close shortcuts">×</button>
    </div>
    <dl class="keys">
      <div><dt><kbd>Space</kbd></dt><dd>Play / pause the live replay</dd></div>
      <div><dt><kbd>1</kbd>–<kbd>5</kbd></dt><dd>Replay · Triage · Head-to-head · Benchmark · How it works</dd></div>
      <div><dt><kbd>R</kbd></dt><dd>Reset the replay</dd></div>
      <div><dt><kbd>G</kbd></dt><dd>Show / hide ground truth</dd></div>
      <div><dt><kbd>T</kbd></dt><dd>Toggle light / dark theme</dd></div>
      <div><dt><kbd>?</kbd></dt><dd>This help</dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd>Close dialogs</dd></div>
    </dl>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="app.js?v=sunrise-2"></script>
<script>/* Watchdog: if any console module fails to load, main() never runs. Say so instead of hanging on "Connecting". */
setTimeout(function(){if(window.__rrBooted)return;var msg='Could not load the console scripts. Reload the page.';
var h=document.getElementById('health');if(h)h.textContent=msg;var m=document.getElementById('main');
if(m&&!document.getElementById('boot-fail')){var d=document.createElement('p');d.id='boot-fail';d.setAttribute('role','alert');d.style.cssText='margin:16px;padding:12px 14px;border:1px solid var(--bad);border-radius:8px';
d.innerHTML=msg+' <button type="button" class="btn btn--sm" onclick="location.reload()">Reload</button>';m.prepend(d);}},10000);</script>
</body>
</html>
